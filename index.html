<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование по C#</title>
    <!-- Подключение Bootstrap 5 (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .quiz-container {
            max-width: 700px;
            margin-top: 50px;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .form-check {
            padding: 12px 12px 12px 40px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .form-check:hover {
            background-color: #f8f9fa;
        }
        .form-check-input:checked + .form-check-label {
            font-weight: bold;
            color: #0d6efd;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="quiz-container mx-auto">
        
        <!-- Экран загрузки -->
        <div id="loading-screen" class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
            <p class="mt-3">Загрузка вопросов из Google Таблиц...</p>
        </div>

        <!-- Начальный экран -->
        <div id="start-screen" class="text-center hidden">
            <h2 class="mb-4">Тест по языку C#</h2>
            <p class="text-muted mb-4">Проверьте свои знания. В тесте <span id="total-questions-start">0</span> вопросов.</p>
            <button class="btn btn-primary btn-lg w-100" onclick="startQuiz()">Начать тестирование</button>
        </div>

        <!-- Экран с вопросами -->
        <div id="quiz-screen" class="hidden">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="badge bg-secondary" id="progress-text">Вопрос 1 из 10</span>
                <span class="badge bg-info text-dark" id="score-text">Правильно: 0</span>
            </div>
            <div class="progress mb-4" style="height: 10px;">
                <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%;"></div>
            </div>

            <div class="question-text" id="question-text">Текст вопроса</div>
            <form id="options-form"></form>
            
            <button class="btn btn-primary w-100 mt-4" id="next-btn" onclick="nextQuestion()" disabled>Ответить</button>
        </div>

        <!-- Экран результатов -->
        <div id="result-screen" class="text-center hidden">
            <h2 class="mb-4">Тестирование завершено!</h2>
            <div class="display-4 mb-3 text-success" id="final-score">0 / 0</div>
            <p class="fs-5 mb-4" id="result-message"></p>
            <button class="btn btn-success btn-lg w-100" onclick="restartQuiz()">Пройти еще раз</button>
        </div>

    </div>
</div>

<!-- Подключение Bootstrap 5 (JS) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ВСТАВЬТЕ СЮДА ID ВАШЕЙ GOOGLE ТАБЛИЦЫ
    const SPREADSHEET_ID = '1sauEkcu2RJjsl7InS8iJ0oQ3wlzT1nUduJePrm56VaU';
    
    // URL для получения данных через Google Visualization API (возвращает JSON)
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let selectedOption = null;

    // DOM Элементы
    const loadingScreen = document.getElementById('loading-screen');
    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionText = document.getElementById('question-text');
    const optionsForm = document.getElementById('options-form');
    const progressText = document.getElementById('progress-text');
    const scoreText = document.getElementById('score-text');
    const progressBar = document.getElementById('progress-bar');
    const nextBtn = document.getElementById('next-btn');

    // Инициализация при загрузке страницы
    window.onload = async () => {
        if (SPREADSHEET_ID === 'ВАШ_ID_ТАБЛИЦЫ') {
            alert('Пожалуйста, укажите ID вашей Google Таблицы в коде JavaScript.');
            loadingScreen.innerHTML = '<p class="text-danger">Ошибка: Не указан ID таблицы.</p>';
            return;
        }
        await fetchQuestions();
    };

    // Получение данных из Google Sheets
    async function fetchQuestions() {
        try {
            const response = await fetch(SHEET_URL);
            const text = await response.text();
            
            // Google возвращает ответ в формате: google.visualization.Query.setResponse({...});
            // Нам нужно вырезать только JSON часть
            const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
            const data = JSON.parse(jsonString);
            
            const rows = data.table.rows;
            questions = rows.map(row => {
                return {
                    question: row.c[0] ? row.c[0].v : '',
                    options: [
                        row.c[1] ? row.c[1].v : '',
                        row.c[2] ? row.c[2].v : '',
                        row.c[3] ? row.c[3].v : '',
                        row.c[4] ? row.c[4].v : ''
                    ],
                    correctIndex: row.c[5] ? parseInt(row.c[5].v) - 1 : 0 // -1 т.к. в таблице ответы 1-4, а индексы в JS 0-3
                };
            }).filter(q => q.question); // Убираем пустые строки

            if (questions.length === 0) {
                throw new Error('Таблица пуста или имеет неверный формат.');
            }

            document.getElementById('total-questions-start').innerText = questions.length;
            loadingScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');

        } catch (error) {
            console.error('Ошибка при загрузке:', error);
            loadingScreen.innerHTML = `
                <div class="alert alert-danger">
                    <strong>Ошибка!</strong> Не удалось загрузить данные.<br>
                    Убедитесь, что таблица открыта для чтения по ссылке и ID указан верно.<br>
                    <small>${error.message}</small>
                </div>`;
        }
    }

    // Начало теста
    function startQuiz() {
        startScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        currentQuestionIndex = 0;
        score = 0;
        showQuestion();
    }

    // Отображение текущего вопроса
    function showQuestion() {
        selectedOption = null;
        nextBtn.disabled = true;
        
        const q = questions[currentQuestionIndex];
        
        // Обновление прогресса
        progressText.innerText = `Вопрос ${currentQuestionIndex + 1} из ${questions.length}`;
        scoreText.innerText = `Правильно: ${score}`;
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        progressBar.style.width = `${progressPercent}%`;
        
        // Вывод текста вопроса
        questionText.innerText = q.question;
        
        // Вывод вариантов ответа
        optionsForm.innerHTML = '';
        q.options.forEach((option, index) => {
            if (!option) return; // Пропускаем пустые варианты
            
            const div = document.createElement('div');
            div.className = 'form-check';
            div.innerHTML = `
                <input class="form-check-input" type="radio" name="option" id="option${index}" value="${index}">
                <label class="form-check-label w-100" for="option${index}">
                    ${option}
                </label>
            `;
            optionsForm.appendChild(div);
        });

        // Обработчик выбора ответа
        optionsForm.querySelectorAll('input[name="option"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                selectedOption = parseInt(e.target.value);
                nextBtn.disabled = false;
            });
        });

        // Меняем текст кнопки на последнем вопросе
        if (currentQuestionIndex === questions.length - 1) {
            nextBtn.innerText = 'Завершить тест';
            nextBtn.classList.replace('btn-primary', 'btn-success');
        } else {
            nextBtn.innerText = 'Ответить';
            nextBtn.classList.replace('btn-success', 'btn-primary');
        }
    }

    // Переход к следующему вопросу
    function nextQuestion() {
        if (selectedOption === null) return;

        // Проверка правильности
        if (selectedOption === questions[currentQuestionIndex].correctIndex) {
            score++;
        }

        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    // Показ результатов
    function showResults() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        
        document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
        
        const percentage = (score / questions.length) * 100;
        let message = '';
        
        if (percentage === 100) message = 'Идеально! Вы отлично знаете C#!';
        else if (percentage >= 80) message = 'Отличный результат! Вы хорошо разбираетесь в C#.';
        else if (percentage >= 50) message = 'Неплохо, но есть над чем поработать.';
        else message = 'Стоит повторить материал и попробовать снова.';

        document.getElementById('result-message').innerText = message;
    }

    // Перезапуск теста
    function restartQuiz() {
        resultScreen.classList.add('hidden');
        startQuiz(); // Возвращаемся сразу к вопросам, не скачивая данные заново
    }
</script>
</body>
</html>
